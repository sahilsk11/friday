[project]
name = "friday"
version = "0.1.0"
description = "Voice interface for opencode"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[deepgram,cartesia,silero,webrtc]>=0.0.100",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "click>=8.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.7.0",
    "vulture>=2.13",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
]

[project.scripts]
friday = "friday.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]

# ─── Linting ────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "F",     # pyflakes — unused imports/vars/names (dead-code basics)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort — import ordering
    "B",     # bugbear — real bug patterns
    "C4",    # comprehensions
    "SIM",   # simplify
    "UP",    # pyupgrade — modern syntax
    "PERF",  # performance
    "RET",   # return cleanup
    "RUF",   # ruff-specific
    "ASYNC", # async pitfalls (we are async-heavy)
    "ARG",   # unused arguments (dead code)
    "ERA",   # eradicate — commented-out code
    "TID",   # tidy imports
    "N",     # pep8-naming
    "PIE",   # misc lints
    "PL",    # pylint subset
]
ignore = [
    "PLR0913", # too many arguments — fine for FastAPI route handlers
    "PLR2004", # magic value — too noisy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004"]
"**/__init__.py" = ["F401"]  # re-exports

# ─── Dead code (more aggressive than ruff F) ────────────────────────────────

[tool.vulture]
paths = ["friday"]
min_confidence = 80
exclude = ["tests/"]

# ─── Tests ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
