[project]
name = "friday-livekit-poc"
version = "0.1.0"
description = "Minimal Friday LiveKit voice proof of concept."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.1",
  "httpx-sse>=0.4.3",
  "livekit-agents[elevenlabs]~=1.5",
  "pydantic-settings>=2.12.0",
  "python-dotenv>=1.2.0",
  "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "ruff>=0.14.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
files = ["server", "agent", "friday"]

[[tool.mypy.overrides]]
module = ["livekit.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]
